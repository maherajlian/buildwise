                "expr": "((histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"buildwise-api\"}[5m]))) > bool 1) * (sum(increase(http_server_requests_total{job=\"buildwise-api\"}[5m])) >= bool 20)) or vector(0)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
