{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "BuildWise",
      "folder": "BuildWise",
      "interval": "1m",
      "rules": [
        {
          "uid": "buildwise-5xx-ratio",
          "title": "Elevated 5xx ratio",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Elevated 5xx ratio",
            "description": "See docs/operations/observability.md for thresholds and minimum-traffic guards."
          },
          "labels": {
            "service": "buildwise-api",
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(((sum(rate(http_server_requests_total{job=\"buildwise-api\",http_response_status_code=~\"5..\"}[5m])) or vector(0)) / clamp_min((sum(rate(http_server_requests_total{job=\"buildwise-api\"}[5m])) or vector(0)), 0.000001) > bool 0.05) * (sum(increase(http_server_requests_total{job=\"buildwise-api\"}[5m])) >= bool 20)) or vector(0)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query",
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "buildwise-high-latency",
          "title": "Sustained high P95 latency",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
