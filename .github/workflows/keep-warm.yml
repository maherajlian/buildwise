name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for API health
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://buildwise-api-p4yq.onrender.com' }}
        shell: bash
        run: |
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 10 \
              --max-time "$remaining" "${API_BASE_URL%/}/health")" || status=000
            if [[ "$status" == 200 ]]; then
              echo 'API /health returned HTTP 200'
              exit 0
            fi
            echo "API /health returned HTTP $status; retrying"
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep "$((remaining < 5 ? remaining : 5))"
            fi
          done
          echo '::error::API /health did not return HTTP 200 within 90 seconds'
          exit 1
